name: Remote source formatting

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: format-${{ github.ref }}
  cancel-in-progress: false

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.ref_name }}
      - name: Reject tag refs (formatting writes a branch)
        env:
          REF_TYPE: ${{ github.ref_type }}
        run: test "$REF_TYPE" = branch
      - name: Install formatter on the hosted runner
        run: sudo apt-get update && sudo apt-get install -y clang-format-18
      - name: Format C++ source remotely
        run: clang-format-18 -i include/neon/*.hpp src/*.cpp tests/*.cpp
      - name: Commit formatting only
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add include/neon src tests/*.cpp
          git commit -m 'style: format C++ on the GitHub-hosted runner'
          git push origin "HEAD:$BRANCH"
          echo 'Formatting commits made with GITHUB_TOKEN do not auto-trigger CI. Dispatch CI or push a version tag to verify this revision.' >> "$GITHUB_STEP_SUMMARY"
